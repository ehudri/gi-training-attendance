<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e79">
  <meta name="robots" content="noindex">
  <title>רישום להדרכה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="brand-mark"></span>המכון לגסטרואנטרולוגיה · הדרכות צוות</div>

    <div id="v-loading"><div class="spinner" role="status" aria-label="טוען"></div></div>

    <!-- message (unknown / closed / error) -->
    <section id="v-msg" class="state" hidden>
      <div class="state-icon grey" id="msg-icon"></div>
      <h1 id="msg-title"></h1>
      <p class="muted" id="msg-text"></p>
      <div id="msg-training" class="muted small"></div>
    </section>

    <!-- main: training + sign-in -->
    <section id="v-main" hidden>
      <div class="card">
        <span class="chip" id="t-cat"></span>
        <h1 id="t-name" style="margin-top:12px"></h1>
        <div class="meta"><span id="t-date"></span><span id="t-instr"></span></div>
      </div>
      <div class="card stack center">
        <p style="font-weight:700;font-size:20px;margin:0">כניסה עם Google</p>
        <p class="muted small" id="returning" hidden></p>
        <div id="gbtn" class="gbtn" aria-label="כניסה עם Google"></div>
        <p class="error" id="main-err" role="alert"></p>
      </div>
      <p class="center"><button type="button" class="linkbtn" id="go-manual">אין לי חשבון Google – רישום ידני</button></p>
    </section>

    <!-- first Google sign-in: complete profile once -->
    <section id="v-profile" hidden>
      <h1>עוד רגע וסיימנו</h1>
      <p class="muted">רק בפעם הראשונה: נא להשלים את הפרטים. בפעמים הבאות הרישום יהיה בלחיצה אחת.</p>
      <p class="muted small" id="profile-email"></p>
      <form id="f-profile" class="card" novalidate>
        <div class="field">
          <label for="p-name">שם מלא בעברית</label>
          <input id="p-name" name="name" autocomplete="name" required maxlength="60">
        </div>
        <div class="field">
          <label for="p-role">תפקיד</label>
          <input id="p-role" name="role" list="roles" required maxlength="40">
        </div>
        <div class="field">
          <label for="p-emp">מספר עובד</label>
          <input id="p-emp" name="empNo" inputmode="numeric" pattern="[0-9]*" required maxlength="12">
          <div class="hint">מספר העובד בהדסה (לא מספר תעודת זהות)</div>
        </div>
        <button class="btn" type="submit">סיום ורישום להדרכה</button>
        <p class="error" id="profile-err" role="alert"></p>
      </form>
    </section>

    <!-- manual -->
    <section id="v-manual" hidden>
      <h1>רישום ידני</h1>
      <p class="muted" id="manual-sub"></p>
      <form id="f-manual" class="card" novalidate>
        <div class="field">
          <label for="m-name">שם מלא בעברית</label>
          <input id="m-name" name="name" autocomplete="name" required maxlength="60">
        </div>
        <div class="field">
          <label for="m-role">תפקיד</label>
          <input id="m-role" name="role" list="roles" required maxlength="40">
        </div>
        <div class="field">
          <label for="m-emp">מספר עובד</label>
          <input id="m-emp" name="empNo" inputmode="numeric" pattern="[0-9]*" required maxlength="12">
          <div class="hint">מספר העובד בהדסה (לא מספר תעודת זהות)</div>
        </div>
        <div class="field">
          <label class="check"><input type="checkbox" id="m-remember" checked> לזכור את הפרטים במכשיר זה</label>
        </div>
        <button class="btn" type="submit">רישום להדרכה</button>
        <p class="error" id="manual-err" role="alert"></p>
      </form>
      <p class="center"><button type="button" class="linkbtn" id="back-main">חזרה לכניסה עם Google</button></p>
    </section>

    <!-- success / already -->
    <section id="v-done" class="state" hidden>
      <div class="state-icon pop" id="done-icon"></div>
      <h1 id="done-title"></h1>
      <div class="who" id="done-name"></div>
      <p class="muted" id="done-training" style="margin-top:12px"></p>
    </section>

    <datalist id="roles">
      <option value="רופא/ה"><option value="רופא/ה מתמחה"><option value="אח/ות"><option value="טכנאי/ת">
      <option value="מזכיר/ה"><option value="כוח עזר"><option value="סטודנט/ית">
    </datalist>
  </main>

  <script src="config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/checkin.js"></script>
</body>
</html>
